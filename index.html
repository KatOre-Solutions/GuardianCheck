<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GuardianCheck</title>
    <meta name="description" content="Secure, real-time child check-in and pickup system for churches." />

    <!--
      Icons. Regenerate with `npx tsx scripts/generate-icons.ts` — the files in public/
      are build output, so edit the generator rather than them.

      favicon.ico is listed first and lives at the site root because it is the only icon
      some consumers look for: Google's favicon fetcher and older feed readers do not
      parse `image/svg+xml`, so dropping the .ico costs the SERP favicon. Browsers that
      do understand SVG still take icon.svg regardless of order — a scalable icon wins
      over a sized raster one in the spec's selection rules.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- iOS ignores the manifest's icons and reads only this one. No `sizes`: with a
         single touch icon Safari uses it for every slot and scales as needed. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!--
      Manifest scope is deliberately favicon + theme only. `display: browser` keeps this
      out of installable-PWA territory, which would need a service worker and an offline
      story the marketing site has no reason to own.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />

    <!--
      Social cards. These static values describe the home page and are what most
      unfurlers actually read: Slack, LinkedIn, WhatsApp and Facebook do not run
      JavaScript, so they never see the per-route values <Seo> writes. Keep them
      accurate for `/` and treat the component's overrides as an upgrade for the
      crawlers that do execute JS. Closing that gap needs SSR — Epic 6 (#47).
    -->
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GuardianCheck" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:url" content="https://guardiancheck.co.za/" />
    <meta property="og:title" content="GuardianCheck" />
    <meta property="og:description" content="Secure, real-time child check-in and pickup system for churches." />
    <meta property="og:image" content="https://guardiancheck.co.za/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GuardianCheck — secure child check-in for churches" />

    <!-- Twitter. `name=`, not `property=`: the Twitter Cards spec uses name, and
         strict unfurlers that ignore `property` would drop twitter:card and
         downgrade the link to a small summary card. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GuardianCheck" />
    <meta name="twitter:description" content="Secure, real-time child check-in and pickup system for churches." />
    <meta name="twitter:image" content="https://guardiancheck.co.za/og-image.png" />
    <meta name="twitter:image:alt" content="GuardianCheck — secure child check-in for churches" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
